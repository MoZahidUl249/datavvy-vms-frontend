# Serves the Flutter web build and proxies the API on the same origin,
# so the browser never needs CORS in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache the entry points, so a new deploy is picked up immediately.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }

    # Hashed assets can be cached.
    location /assets/ { add_header Cache-Control "public, max-age=604800"; }

    # Path URLs (/vehicles/12): unknown paths load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
